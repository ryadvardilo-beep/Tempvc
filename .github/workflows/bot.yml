name: Discord Bot 24/7 Runner

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    # Trigger automatically every 5 hours (before GitHub's 6h job limit)
    - cron: '0 */5 * * *'

concurrency:
  group: discord-bot-runner
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install
          else
            npm install
          fi

      - name: Build Project
        run: |
          if command -v bun &> /dev/null; then
            bun run build || npm run build || true
          else
            npm run build || true
          fi

      - name: Run Discord Bot with Self-Restart Loop
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PORT: 3000
        run: |
          echo "🚀 Starting Discord Bot 24/7 on GitHub Actions..."
          # Run bot using bun or tsx with timeout
          timeout 18000s bun run start || timeout 18000s npm run start || timeout 18000s npx tsx server.ts || true
          echo "🔄 Cycle completed cleanly, restarting in next schedule..."
